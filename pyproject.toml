[project]
name = "agentic-coding-harness"
version = "0.1.0"
description = "Modular, model-agnostic agentic coding harness with local inference"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=1.7.2",
    "transformers>=5.3.0",
    "torch>=2.10",
    "datasets<=4.3.0",
    "torchvision>=0.25.0",
    "torchaudio>=2.10.0",
    "psutil>=7.2.2",
    "packaging<=24.1",
    "accelerate>=1.13.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "websockets>=15.0",
    "safetensors>=0.5.0",
    "jinja2>=3.1.0",
    "bitsandbytes>=0.45.0",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
torchaudio = { index = "pytorch-cu130" }
